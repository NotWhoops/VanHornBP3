<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="./styles/styles.css">


</head>

<body>
  <div class="pad1">
    <div class="gridOne">
      <div class="bgColor cardOne">
        <img class="img imgBorder" src="./images/image-jeremy.png" alt="jeremy">
        <p class="textColor2">Report for</p>
        <p class="textColor">Jeremy Robson</p>
        <div class="bgColor2">
          <p id="daily" class="dailyColor daily1">Daily</p>
          <p id="weekly" class="weeklyColor weekly1">Weekly</p>
          <p id="monthly" class="monthlyColor monthly1">Monthly</p>
        </div>
      </div>
      <div>
        <div class="workColor cardTwo">
          <div class="bgColor3">
            <p class="textColor3">Work</p>
            <p id="workHours" class="textColor4">32hrs</p>
            <p id="workWeek" class="textColor5">Last Week - 36hrs</p>
          </div>
        </div>
      </div>
      <div>
        <div class="playColor cardThree">
          <div class="bgColor3">
            <p class="textColor3">Play</p>
            <p id="playHours" class="textColor4">10hrs</p>
            <p id="playWeek" class="textColor5">Last Week - 8hrs</p>
          </div>
        </div>
      </div>
      <div>
        <div class="studyColor cardFour">
          <div class="bgColor3">
            <p class="textColor3">Study</p>
            <p id="studyHours" class="textColor4">4hrs</p>
            <p id="studyWeek" class="textColor5">Last Week - 7hrs</p>
          </div>
        </div>
      </div>
      <div>
        <div class="exerciseColor cardFive">
          <div class="bgColor3">
            <p class="textColor3">Exercise</p>
            <p id="exerciseHours" class="textColor4">4hrs</p>
            <p id="exerciseWeek" class="textColor5">Last Week - 5hrs</p>
          </div>
        </div>
      </div>
      <div>
        <div class="socialColor cardSix">
          <div class="bgColor3">
            <p class="textColor3">Social</p>
            <p id="socialHours" class="textColor4">5hrs</p>
            <p id="socialWeek" class="textColor5">Last Week - 10hrs</p>
          </div>
        </div>
      </div>
      <div>
        <div class="selfColor cardSeven">
          <div class="bgColor3">
            <p class="textColor3">Self Care</p>
            <p id="selfHours" class="textColor4">2hrs</p>
            <p id="selfWeek" class="textColor5">Last Week - 2hrs</p>
          </div>
        </div>
      </div>
    </div>
  </div>



  <script type="module" src="./app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
</body>

</html>
