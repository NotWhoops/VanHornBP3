<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="./styles/styles.css">


</head>

<body>
    <div class="col">
      <div class="bgColor">
        <img class="img imgBorder" src="./images/image-jeremy.png" alt="jeremy">
        <p class="textColor2">Report for</p>
        <p class="textColor">Jeremy Robson</p>
      </div>
    </div>
    <div class="bgColor2">
      <p class="dailyColor">Daily</p>
      <p class="weeklyColor">Weekly</p>
      <p class="monthlyColor">Monthly</p>
    </div>
    <div class="workColor"></div>
    <div class="bgColor3">
      <p class="textColor3">Work</p>
      <p class="textColor4">32hrs <!-- weekly --></p> 
      <p class="textColor5">Previous - 36hrs <!-- weekly --></p>
    </div>
    <div class="playColor"></div>
    <div class="bgColor3">
        <p class="textColor3">Play</p>
        <p class="textColor4">10hrs <!-- weekly --></p>
        <p class="textColor5">Previous - 8hrs <!-- weekly --></p>
      </div>
      <div class="studyColor"></div>
      <div class="bgColor3">
      <p class="textColor3">Study</p>
      <p class="textColor4">4hrs <!-- weekly --></p>
      <p class="textColor5">Previous - 7hrs <!-- weekly --></p>
    </div>
    <div class="exerciseColor"></div>
    <div class="bgColor3">
      <p class="textColor3">Exercise</p>
      <p class="textColor4">4hrs <!-- weekly --></p> 
      <p class="textColor5">Previous - 5hrs <!-- weekly --></p>
    </div>
    <div class="socialColor"></div>
    <div class="bgColor3">
      <p class="textColor3">Social</p>
      <p class="textColor4">5hrs <!-- weekly --></p>
      <p class="textColor5">Previous - 10hrs <!-- weekly --></p>
    </div>
    <div class="selfColor"></div>
    <div class="bgColor3">
      <p class="textColor3">Self Care</p>
      <p class="textColor4">2hrs <!-- weekly --></p>
      <p class="textColor5">Previous - 2hrs <!-- weekly --></p>
    </div>


  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Brandon</a>.
  </div>

  <script src="./app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
</body>

</html>
